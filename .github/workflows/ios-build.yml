name: iOS build, tests & screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Game logic tests
        run: ./Tools/test.sh | tee tests.log

      - name: Build app (iOS Simulator, no signing)
        run: |
          set +e
          xcodebuild -project HamsterAges.xcodeproj -scheme HamsterAges \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          status=$?
          grep -E "^/.*(error|warning): " build.log | sed -E 's#^.*/HamsterAges/##' | sort -u > diagnostics.txt || true
          # Surface compiler errors as annotations (readable through the checks API).
          grep -E "error: " diagnostics.txt | head -40 | while IFS= read -r line; do echo "::error::$line"; done
          echo "::notice::warnings=$(grep -c 'warning: ' diagnostics.txt) errors=$(grep -c 'error: ' diagnostics.txt)"
          exit $status

      - name: Release build check (catches DEBUG-only code leaking out)
        run: |
          xcodebuild -project HamsterAges.xcodeproj -scheme HamsterAges -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-release -configuration Release CODE_SIGNING_ALLOWED=NO build > release.log 2>&1 \
            || (grep -E "error: " release.log | head -30; exit 1)

      - name: Collect localizable strings
        run: |
          mkdir -p loc
          find build -name "*.stringsdata" -exec cp {} loc/ \; || true
          ls loc | head -50

      - name: Screenshots in the simulator
        run: |
          set -x
          UDID=$(xcrun simctl list devices available | grep -E "iPhone [0-9]+ Pro \(" | tail -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          APP=$(find build/Build/Products -name "HamsterAges.app" -maxdepth 3 | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shot() { # name, wait seconds, launch args...
            local name=$1 wait=$2; shift 2
            xcrun simctl terminate "$UDID" com.valkhim.hamsterages || true
            xcrun simctl launch "$UDID" com.valkhim.hamsterages "$@"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shot 1-home 8 -demo
          shot 2-card-pick 6 -demo -screen battle
          shot 3-battle-early 20 -demo -screen battle -autoplay
          sleep 35; xcrun simctl io "$UDID" screenshot shots/4-battle-mid.png
          sleep 45; xcrun simctl io "$UDID" screenshot shots/5-battle-late.png
          shot 6-heroes 6 -demo -screen heroes
          shot 7-upgrades 6 -demo -screen upgrades
          shot 8-quests 6 -demo -screen quests
          shot 9-shop 6 -demo -screen shop
          shot 19-pass 6 -demo -screen pass
          shot 15-art-hamsters 6 -demo -screen art
          shot 16-art-rats 6 -demo -screen artrat
          shot 17-art-bases 6 -demo -screen artbase
          shot 18-art-backgrounds 8 -demo -screen artbg
          shot 24-art-rat-generals 6 -demo -screen artgen
          shot 28-map 6 -demo -screen map
          shot 29-share-card 6 -demo -screen artshare
          shot 25-taunt 4 -demo -screen battle -autoplay -stage 7
          shot 26-elites 34 -demo -screen battle -autoplay -stage 14 -era 1
          shot 27-boss 40 -demo -screen battle -autoplay -stage 10 -era 2
          shot 11-home-uk 8 -demo -AppleLanguages "(uk)" -AppleLocale uk_UA
          shot 12-card-pick-ja 6 -demo -screen battle -AppleLanguages "(ja)" -AppleLocale ja_JP
          shot 13-heroes-de 6 -demo -screen heroes -AppleLanguages "(de)" -AppleLocale de_DE
          shot 14-upgrades-es 6 -demo -screen upgrades -AppleLanguages "(es)" -AppleLocale es_ES
          xcrun simctl uninstall "$UDID" com.valkhim.hamsterages
          xcrun simctl install "$UDID" "$APP"
          shot 10-first-launch 8
          xcrun simctl spawn "$UDID" log show --last 5m --predicate 'process == "HamsterAges"' --style compact > sim.log 2>&1 || true
          # iPad layout check
          IPAD=$(xcrun simctl list devices available | grep -E "iPad Pro 13" | tail -1 | grep -oE "[0-9A-F-]{36}")
          if [ -n "$IPAD" ]; then
            xcrun simctl shutdown "$UDID" || true
            UDID=$IPAD
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            # Try to rotate the iPad to landscape through the Simulator UI (needs GUI scripting; best effort).
            open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
            sleep 8
            perl -e 'alarm 20; exec @ARGV' osascript -e 'tell application "Simulator" to activate' -e 'delay 1' \
              -e 'tell application "System Events" to key code 124 using command down' || echo "rotate failed"
            sleep 3
            shot 20-ipad-home 8 -demo
            shot 21-ipad-battle 30 -demo -screen battle -autoplay -era 2
            shot 22-ipad-heroes 6 -demo -screen heroes
            shot 23-ipad-cards 6 -demo -screen battle
          fi

      - name: Publish logs & screenshots to the ci-artifacts branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -R shots loc /tmp/out/ 2>/dev/null || true
          cp build.log release.log diagnostics.txt tests.log sim.log /tmp/out/ 2>/dev/null || true
          git config user.name "ci-bot" && git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-artifacts
          git rm -rf . -q
          git clean -fdxq
          cp -R /tmp/out/. .
          git add -A
          git commit -q -m "CI artifacts for ${GITHUB_SHA::7}"
          git push -f origin ci-artifacts

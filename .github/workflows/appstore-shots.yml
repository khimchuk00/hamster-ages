name: App Store screenshots (all languages)

# Run: push any commit to the `shots` branch
#   git push -f origin HEAD:shots
# Raw simulator captures per language land on the `appstore-shots` branch;
# Tools/aso/make_screenshots.py turns them into captioned App Store images.
#
# Split into parallel jobs (device × language group) so no single macOS runner has to grind through
# 144 launches — the old single-job version regularly ran past its time limit.
on:
  push:
    branches: [shots]

permissions:
  contents: write

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: [iphone, ipad]
        langs: ["en uk de es", "fr it pt-BR ja", "ko zh-Hans zh-Hant tr"]
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)" && xcodebuild -version

      - name: Build (Debug, simulator)
        run: |
          xcodebuild -project HamsterAges.xcodeproj -scheme HamsterAges \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || (tail -50 build.log; exit 1)

      - name: Capture
        timeout-minutes: 35
        env:
          LANGS: ${{ matrix.langs }}
          DEVICE: ${{ matrix.device }}
        run: |
          set -x
          OUT=out/$([ "$DEVICE" = ipad ] && echo raw-ipad || echo raw)
          if [ "$DEVICE" = ipad ]; then
            UDID=$(xcrun simctl list devices available | grep -E "iPad Pro 13" | tail -1 | grep -oE "[0-9A-F-]{36}")
          else
            UDID=$(xcrun simctl list devices available | grep -E "iPhone [0-9]+ Pro Max \(" | tail -1 | grep -oE "[0-9A-F-]{36}")
          fi
          xcrun simctl boot "$UDID"; perl -e 'alarm 300; exec @ARGV' xcrun simctl bootstatus "$UDID" -b || echo "boot timeout"
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          APP=$(find build/Build/Products -name "HamsterAges.app" -maxdepth 3 | head -1)
          xcrun simctl install "$UDID" "$APP"
          if [ "$DEVICE" = ipad ]; then
            # Landscape via the Simulator UI (best effort).
            open -a Simulator --args -CurrentDeviceUDID "$UDID" || true
            sleep 8
            perl -e 'alarm 20; exec @ARGV' osascript -e 'tell application "Simulator" to activate' -e 'delay 1' \
              -e 'tell application "System Events" to key code 124 using command down' || echo "rotate failed"
            sleep 3
          fi
          ID=com.valkhim.hamsterages
          for L in $LANGS; do
            mkdir -p "$OUT/$L"
            loc=$(echo "$L" | tr '-' '_')
            shot() { # name, wait, args...
              local name=$1 wait=$2; shift 2
              perl -e 'alarm 30; exec @ARGV' xcrun simctl terminate "$UDID" $ID || true
              perl -e 'alarm 60; exec @ARGV' xcrun simctl launch "$UDID" $ID -AppleLanguages "($L)" -AppleLocale "$loc" "$@" || echo "launch timeout $L $name"
              sleep "$wait"
              perl -e 'alarm 30; exec @ARGV' xcrun simctl io "$UDID" screenshot "$OUT/$L/$name.png" || echo "shot timeout $L $name"
            }
            shot 1-battle 38 -demo -screen battle -autoplay -era 1
            shot 2-cards 7 -demo -screen battle -era 2
            shot 3-future 34 -demo -screen battle -autoplay -era 4
            shot 4-heroes 7 -demo -screen heroes
            shot 5-rivals 6 -demo -screen battle -autoplay -stage 7
            shot 6-map 7 -demo -screen map
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.device }}-${{ strategy.job-index }}
          path: out
          retention-days: 3

  publish:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/parts
      - name: Merge and push to appstore-shots
        run: |
          mkdir -p /tmp/out
          for d in /tmp/parts/*/; do cp -R "$d". /tmp/out/; done
          find /tmp/out -name "*.png" | wc -l
          git config user.name "ci-bot" && git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan appstore-shots
          git rm -rf . -q
          git clean -fdxq
          cp -R /tmp/out/. .
          git add -A
          git commit -q -m "App Store raw screenshots for ${GITHUB_SHA::7}"
          git push -f origin appstore-shots
